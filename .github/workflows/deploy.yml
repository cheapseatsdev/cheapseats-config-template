name: deploy

# On every merge to main: build this repo's image (Cheap Seats with this config) and push it to
# ghcr.io/<this repo>:sha-<commit>, then deploy it if the repository variable DEPLOY says where:
#
#   DEPLOY=docker-host  secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_HOST_KEY (see deploy/README.md)
#   DEPLOY=kubernetes   secret KUBECONFIG, and deploy/values.yaml (see deploy/README.md)
#   unset               build and push only
#
# Rolling back is re-running an earlier successful run of this workflow. Only main publishes and
# deploys: a run started by hand from another branch does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      cheapseats: ${{ steps.tag.outputs.cheapseats }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: tag
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
          echo "cheapseats=$(sed -n 's/^FROM [^:]*:\([^@]*\).*$/\1/p' Dockerfile | head -1)" >>"$GITHUB_OUTPUT"
      - run: docker run --rm -v "$PWD:/config:ro" "$(sed -n 's/^FROM //p' Dockerfile | head -1)" check
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: REVISION=${{ github.sha }}
          provenance: false

  docker-host:
    needs: image
    if: vars.DEPLOY == 'docker-host'
    runs-on: ubuntu-24.04
    environment: production
    # The host only pulls, so the token it's sent can only read packages.
    permissions:
      packages: read
    steps:
      - name: SSH to the host
        id: ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" >key
          # The host's own public key: a fresh runner has no known_hosts, so without it the first
          # thing to answer at the host's name would get the token below.
          if [ -z "$HOST_KEY" ]; then
            echo "set the DEPLOY_HOST_KEY secret to the host's public key (see deploy/README.md)" >&2
            exit 1
          fi
          printf '%s %s\n' "$HOST" "$HOST_KEY" >known_hosts
      - name: deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.image.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh="ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes $USER@$HOST"
          # The image is private: log the host in with this run's token just long enough to pull.
          printf '%s' "$TOKEN" | $ssh "docker login ghcr.io -u $ACTOR --password-stdin >/dev/null"
          $ssh "cd cheapseats && CHEAPSEATS_IMAGE=$IMAGE docker compose pull && CHEAPSEATS_IMAGE=$IMAGE docker compose up -d --wait && echo CHEAPSEATS_IMAGE=$IMAGE >image.env"
      - name: log the host out of GHCR
        # Also after a failed deploy, so the host never keeps the token.
        if: always() && steps.ssh.outcome == 'success'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$USER@$HOST" "docker logout ghcr.io >/dev/null"

  kubernetes:
    needs: image
    if: vars.DEPLOY == 'kubernetes'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: helm upgrade
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.image.outputs.cheapseats }}
        run: |
          install -m 600 /dev/null kubeconfig && printf '%s\n' "$KUBECONFIG_DATA" >kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          # The chart is released with the app, at the same version as the Dockerfile's FROM.
          helm upgrade --install cheapseats oci://ghcr.io/cheapseatsdev/charts/cheapseats --version "$VERSION" \
            -f deploy/values.yaml --set image.repository="${IMAGE%:*}" --set image.tag="${IMAGE##*:}" \
            --rollback-on-failure --timeout 5m
