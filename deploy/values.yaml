# Helm values for this deployment; the deploy workflow sets the image. Everything the chart takes
# is in its values.yaml: helm show values oci://ghcr.io/cheapseatsdev/charts/cheapseats
existingSecret: cheapseats        # CHEAPSEATS_TOKENS, ANTHROPIC_API_KEY, OPENAI_API_KEY
imagePullSecrets:
  - name: ghcr                 # this repo's image is private
persistence:
  size: 1Gi
ingress:
  enabled: false
